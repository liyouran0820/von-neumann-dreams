<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>夜白映射 · 午夜学院</title><link rel="stylesheet" href="./style.css"></head><body>
<header><a class="brand" href="#">午夜学院 <span>夜白映射</span></a><nav id="levels" aria-label="学院导览"></nav></header>
<main><section class="heading"><div><span id="chapter" class="eyebrow"></span><h1 id="title"></h1><p id="goal"></p></div><button id="help">操作 / 提示</button></section>
<section id="intro" class="intro"><strong>同一个推动，两边各自回应。</strong><span>点真实物件预览 → 激活映射 → 左右推动。WASD / 点地面走路。V观察，F穿门。</span><button id="begin">进入庭院</button></section>
<div class="workspace"><section class="scene"><div class="scene-top"><div id="status"></div><button id="view">切换观察 V</button><button id="body-view">返回身体视角</button></div><div id="board"></div><div id="message" role="status" aria-live="polite"></div><div class="legend"><span>实面：齐平桥</span><span>虚线：预览，不承重</span><span>斜纹：替换后消失</span><span>玻璃 / 墙：不可穿过</span></div><div class="movement"><span>走路</span><button data-move="0,-1" aria-label="向上走">↑</button><button data-move="-1,0" aria-label="向左走">←</button><button data-move="0,1" aria-label="向下走">↓</button><button data-move="1,0" aria-label="向右走">→</button><button id="teleport">穿门 F</button></div></section>
<aside><section class="panel"><h2>另一端 <span id="other-title"></span></h2><div id="mini"></div><div id="feedback"></div></section><section class="panel"><h2 id="mapping"></h2><div id="objects"></div><p id="preview-status"></p><div class="actions"><button id="activate">激活映射 E</button><button id="cancel-preview">取消预览</button><button id="unlink">解除 Q</button></div><div class="push"><button data-push="left">← 推动</button><button data-push="right">推动 →</button></div></section><section class="panel"><h2>公开目标</h2><ul id="goals"></ul></section></aside></div>
<footer><button id="undo">撤销 Z</button><button id="recover">恢复安全点</button><button id="reset">整关重置</button><button id="hint">查看提示 H1</button><button id="clear-progress">清除记录并重玩</button></footer><section id="help-panel" class="panel" hidden><p>WASD 走路；方向键推动映射箱。点地面自动寻路，点真实箱 / 桥预览。V 只切观察；在 P1 / P2 上按 F 才改变身体世界。E 激活，Q 解除，Z 撤销。另一世界观察期间可远程映射与推动。</p><p id="hint-text"></p></section><section id="completion" class="completion" hidden><strong id="complete-title"></strong><button id="next">前往下一处</button><button id="replay">重新试玩</button></section></main><script type="module" src="./app.js"></script></body></html>
